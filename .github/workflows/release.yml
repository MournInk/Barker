name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TZ: Asia/Shanghai

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.2"
          cache: pnpm
      - name: Verify version syntax and package agreement
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            test "$(git cat-file -t "$RELEASE_REF")" = tag
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { parseVersion } from './scripts/release-guard.mjs';
          if (process.env.RELEASE_REF.startsWith('refs/tags/')) {
            const version = process.env.RELEASE_NAME.replace(/^v/, '');
            parseVersion(version);
            if (version !== JSON.parse(readFileSync('package.json', 'utf8')).version) throw new Error('Tag and package.json versions differ');
          }
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Test new version candidate
        if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created
        run: pnpm test
      - run: BARKER_DATA_DIR="$(mktemp -d)" BARKER_DISABLE_SCHEDULER=1 pnpm build
      - name: Test browser interactions for new candidate
        if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          pnpm test:browser

  image:
    needs: verify
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.2"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing version and source tags
        id: initial
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-guard.mjs --check-platforms
      - name: Build and smoke each candidate platform
        env:
          VERSION: ${{ steps.initial.outputs.version }}
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            docker buildx build --load --platform "linux/$architecture" --tag "barker:candidate-$architecture" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.licenses=MIT" .
            BARKER_SMOKE_PLATFORM="linux/$architecture" node scripts/container-smoke.mjs "barker:candidate-$architecture"
          done
      - name: Recheck registry before publication
        id: candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-guard.mjs --check-platforms
      - name: Push verified platform images and immutable manifest
        id: publish
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
          VERSION: ${{ steps.candidate.outputs.version }}
          CHANNELS: ${{ steps.candidate.outputs.channels }}
        run: |
          set -euo pipefail
          sources=()
          for architecture in amd64 arm64; do
            platform_tag="$IMAGE:sha-$GITHUB_SHA-$VERSION-$architecture"
            docker tag "barker:candidate-$architecture" "$platform_tag"
            push_output="$(docker push --quiet "$platform_tag")"
            [[ "$push_output" =~ (sha256:[0-9a-f]{64}) ]]
            pushed_digest="${BASH_REMATCH[1]}"
            sources+=("$IMAGE@$pushed_digest")
          done
          tags=()
          tags+=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$GITHUB_SHA")
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Pull and verify published digest on each platform
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            docker pull --platform "linux/$architecture" "$IMAGE@$DIGEST"
            BARKER_SMOKE_PLATFORM="linux/$architecture" node scripts/container-smoke.mjs "$IMAGE@$DIGEST"
          done
      - name: Promote tested digest to stable channels
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
          VERSION: ${{ steps.candidate.outputs.version }}
          CHANNELS: ${{ steps.candidate.outputs.channels }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r channel; do
            docker buildx imagetools create --tag "$IMAGE:$channel" "$IMAGE@$DIGEST"
            test "$(docker buildx imagetools inspect "$IMAGE:$channel" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          done < <(node -e 'JSON.parse(process.env.CHANNELS).filter(value => value !== process.env.VERSION && value !== `sha-${process.env.GITHUB_SHA}`).forEach(value => console.log(value))')
